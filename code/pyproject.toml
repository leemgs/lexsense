[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexsense-starter"
version = "0.1.0"
description = "LexSense reproducibility starter with GovSense-1k synthetic benchmark"
authors = [{name = "Geunsik Lim"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.66.0"
]
